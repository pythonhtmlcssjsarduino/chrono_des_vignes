[project]
name = "chrono-des-vignes"
version = "0.1.0"
description = "a timing system for sport events. GPL-3.0-or-later "
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENCE.md"]
authors = [{name="Romain Maurer", email="chrono-des-vignes@ikmail.com"}]
dependencies = [
    "colour>=0.1.5",
    "cryptography>=50.0.0",
    "email-validator>=2.3.0",
    "fakeredis>=2.37.0",
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "flask-bcrypt==1.0.1",
    "flask-login==0.6.3",
    "flask-migrate>=4.1.0",
    "flask-pydantic>=0.14.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-sse>=1.0.0",
    "flask-wtf>=1.3.0",
    "icecream>=2.2.0",
    "markdown>=3.10.3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.0",
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "requests>=2.34.2",
    "sentry-sdk>=2.68.0",
    "sqlalchemy>=2.0.52",
    "sqlalchemy-utils>=0.42.1",
    "werkzeug>=3.1.8",
    "xlsxwriter>=3.2.9",
]

[project.urls]
"source code" = "https://github.com/pythonhtmlcssjsarduino/chrono_des_vignes"

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-static-i18n>=1.3.1",
    "mkdocs-macros-plugin>=1.5.0",
    "types-mock>=5.2.0.20260518",
    "tomlkit>=0.15.1",
    "typer>=0.27.1",
]

[tool.pyright]
reportImportCycles = false
reportUnusedCallResult = false
reportExplicitAny = false
