[project]
name = "chrono-des-vignes"
version = "0.1.0"
description = "a timing system for sport events. GPL-3.0-or-later "
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENCE.md"]
authors = [{name="Romain Maurer", email="chrono-des-vignes@ikmail.com"}]
dependencies = [
    "colour==0.1.5",
    "cryptography==48.0.1",
    "email-validator>=2.2.0",
    "flask==3.0.3",
    "flask-babel==4.0.0",
    "flask-bcrypt==1.0.1",
    "flask-login==0.6.3",
    "flask-migrate==4.0.7",
    "flask-pydantic>=0.14.0",
    "flask-socketio>=5.5.1",
    "flask-sqlalchemy==3.1.1",
    "flask-sse>=1.0.0",
    "flask-wtf==1.2.2",
    "icecream>=2.1.3",
    "markdown>=3.3.7",
    "pillow==10.4.0",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.1.1",
    "python-dotenv==1.2.2",
    "reportlab==4.2.5",
    "requests==2.32.3",
    "sentry-sdk>=2.66.1",
    "sqlalchemy==2.0.36",
    "sqlalchemy-utils>=0.41.2",
    "werkzeug==3.0.4",
    "xlsxwriter>=3.0.3",
]

[project.urls]
"source code" = "https://github.com/pythonhtmlcssjsarduino/chrono_des_vignes"

[dependency-groups]
dev = [
    "invoke>=2.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.16",
    "mkdocs-static-i18n>=1.3.0",
    "mkdocs-macros-plugin>=1.5.0",
    "gunicorn>=26.0.0",
    "gevent>=26.7.0",
]

[tool.pyright]
reportImportCycles = false
reportUnusedCallResult = false
reportExplicitAny = false
